name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Compile + pure-JVM unit tests (DocumentState, BinaryResolver,
      # SchemalockInspectionSuppressor). No bundled binary or IDE download
      # required, so this runs on every PR including from forks.
      - name: Unit tests
        run: ./gradlew --no-daemon test
