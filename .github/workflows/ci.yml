name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests (DocumentState, BinaryResolver, SchemalockInspectionSuppressor)
      # are pure JVM tests — no bundled binary required, so this job runs on every
      # PR including from forks. This is the required status check.
      - name: Unit tests
        run: ./gradlew --no-daemon test

  verify:
    name: Build plugin · verify
    # The pinned app binary lives in the private schemalock/app repo, reached via
    # a GitHub App token. Secrets are unavailable on fork PRs and to Dependabot,
    # so this job runs only on push to master, workflow_dispatch, and same-repo PRs.
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # verifyPlugin downloads several full IDE distributions (tens of GB).
      # Reclaim space from preinstalled toolchains we don't use, inline to avoid
      # adding a third-party action to the supply chain.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.SCHEMALOCK_APP_ID }}
          private-key: ${{ secrets.SCHEMALOCK_APP_PRIVATE_KEY }}
          repositories: app

      # Reuse the released app binary pinned by .app-version instead of compiling
      # ../app. CI runs on linux-x64; buildPlugin grafts whatever is under bin/ into
      # the ZIP, so one platform is enough to exercise packaging + verification.
      - name: Download pinned schemalock binary (linux-x64)
        run: |
          APP_TAG=$(tr -d '[:space:]' < .app-version)
          mkdir -p bin/linux-x64
          gh release download "$APP_TAG" \
            --repo schemalock/app \
            --pattern "schemalock-linux-x64" \
            --output bin/linux-x64/schemalock
          chmod +x bin/linux-x64/schemalock
          ./bin/linux-x64/schemalock --version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin and verify
        run: ./gradlew --no-daemon buildPlugin verifyPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
