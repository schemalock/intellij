name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      # Buildless extraction: CodeQL's compiler interceptor (used by build-mode
      # "manual") caps at Kotlin < 2.3.30 and rejects our Kotlin 2.4 toolchain.
      # build-mode "none" parses sources directly without tracing kotlinc, so it
      # sidesteps that version gate and needs no JDK/Gradle setup.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
