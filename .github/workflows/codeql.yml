name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - uses: gradle/actions/setup-gradle@v6

      # Manual build mode: CodeQL traces this compile to build its database.
      # gradle.properties enables the build cache, which would serve compileKotlin
      # from cache (no compiler run) and leave CodeQL with no code to analyze
      # ("didn't build any of it"). Force a real compile with clean + no build cache.
      - name: Compile for CodeQL
        run: ./gradlew --no-daemon --no-build-cache clean compileKotlin compileTestKotlin

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
