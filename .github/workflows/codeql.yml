name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - uses: gradle/actions/setup-gradle@v6

      # Manual build mode: CodeQL traces this compile to build its database.
      # - clean + --no-build-cache: gradle.properties enables the build cache,
      #   which would serve compileKotlin from cache (no compiler run) and leave
      #   CodeQL with no code ("didn't build any of it"). Force a real compile.
      # - Kotlin pinned < 2.3.30 in build.gradle.kts so CodeQL's extractor accepts it.
      # - in-process compiler: CodeQL's extractor runs inside the Kotlin compiler
      #   process; running it in-process keeps it in the Gradle build JVM, which
      #   gets its heap from org.gradle.jvmargs (-Xmx4g in gradle.properties).
      - name: Compile for CodeQL
        run: >
          ./gradlew --no-daemon --no-build-cache clean compileKotlin compileTestKotlin
          -Pkotlin.compiler.execution.strategy=in-process

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
