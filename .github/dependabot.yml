version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # JUnit 6.x is a breaking change (fails compileTestKotlin); stay on 5.x
      # until the tests are migrated. Minor/patch 5.x updates still flow.
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]
      # Kotlin pinned < 2.3.30 for CodeQL extractor support (2.4.0 is rejected).
      # Bump manually once GitHub's CodeQL adds newer Kotlin support.
      # NB: the `kotlin("jvm")` plugin is surfaced by Dependabot under the name
      # "jvm" (not org.jetbrains.kotlin*), so that name must be ignored directly
      # or the pin silently misses — which is what let Kotlin 2.4.0 through once.
      - dependency-name: "jvm"
      - dependency-name: "org.jetbrains.kotlin*"
    groups:
      gradle-deps:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
